# NOTE: hand-written scaffold (not generated by `shopify app generate
# extension`, which requires an authenticated CLI session). Verify this
# against a freshly generated "Product discount" function extension with
# `shopify app generate extension` once you're logged in, before deploying.

api_version = "2026-07"
uid = "f30c18d6-00b0-26f9-3abb-3a411b0794079724a70e"

[[extensions]]
name = "GW Tier Discount"
handle = "gw-tier-discount"
type = "function"
description = "Applies the quantity-tier bundle price selected on the storefront."

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  export = "cart-lines-discounts-generate-run"

[extensions.build]
# Left empty on purpose: for a JavaScript function (entry file named
# src/index.js), the CLI's built-in esbuild+javy pipeline runs automatically.
# Setting this to a command that shells back into `shopify app function
# build` causes infinite recursion (confirmed by reading the CLI's bundled
# source at node_modules/@shopify/cli/dist/index.js) and setting it to any
# other project's own build script also isn't needed here.
command = ""
path = "dist/function.wasm"
watch = ["src/**/*.js"]

# No [extensions.ui.paths] section: the app creates and manages a single
# automatic app discount pointing at this function itself (see
# ensureTierDiscountIsActive in app/models/tierDiscount.server.ts) instead of
# relying on the merchant to create it from the native Discounts screen.
